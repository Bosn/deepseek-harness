# Opt-in runnable WeChat turn-completion example. Deployment supplies an
# absolute sender command and an owner-only route file; the snapshot sibling
# replaces both with hermetic workspace fixtures.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./session-title.cordis.yml
    patches:
      - insert:
          - id: turn-notify-wechat
            name: '@deepseek-ai/dsh-turn-notify-wechat'
            config:
              command: !!js process.env.DSH_WECHAT_NOTIFY_COMMAND
              routeFile: !!js process.env.DSH_WECHAT_NOTIFY_ROUTE_FILE
              settleDelayMs: 500
              maxConcurrentDeliveries: 2
