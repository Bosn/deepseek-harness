# Keyless counterpart of turn-notify-wechat.cordis.yml. The snapshot harness
# prepares the absolute executable and route paths inside its generated cwd.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./session-title.cordis.snapshot.yml
    patches:
      - insert:
          - id: turn-notify-wechat
            name: '@deepseek-ai/dsh-turn-notify-wechat'
            config:
              command: !!js "process.cwd() + '/snapshot-wechat-sender.mjs'"
              routeFile: !!js "process.cwd() + '/snapshot-wechat-route.env'"
              settleDelayMs: 500
              maxConcurrentDeliveries: 2
